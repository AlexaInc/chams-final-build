name: chams-64bit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      VisualStudioVersion: '17.0'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build ReShade Release x64
      run: msbuild ReShade.sln /p:Configuration=Release /p:Platform=x64 /p:VisualStudioVersion=17.0 /m
